name: SonarCloud

# Análisis estático centralizado. Requiere el secreto SONAR_TOKEN
# (SonarCloud > My Account > Security). Sin el secreto, el escaneo se omite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Tests con cobertura
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-only-test-secret-not-for-production
      - name: Escaneo SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
