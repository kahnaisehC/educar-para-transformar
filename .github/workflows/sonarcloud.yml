name: SonarCloud

# DESACTIVADO (2026-11-10): la organización de SonarCloud tiene un problema de
# facturación y el check "Análisis SonarCloud" queda en rojo, bloqueando los
# deploys de Render (autoDeployTrigger: checksPass).
#
# Se dejó el flujo solo con disparo manual para no romper la trazabilidad de la
# Unidad 5. Para reactivarlo, restaurar los disparadores push/pull_request:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
# y volver a agregar "Análisis SonarCloud" a los checks obligatorios de
# docs/POLITICA_PR.md.
on:
  workflow_dispatch: {}

jobs:
  sonarcloud:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Tests con cobertura
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-only-test-secret-not-for-production
      - name: Escaneo SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
