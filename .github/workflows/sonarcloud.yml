name: SonarCloud

# DESACTIVADO (2026-11-10): SonarCloud ya publica el check
# "SonarCloud Code Analysis" mediante su Automatic Analysis, que corre en los
# servidores de Sonar y NO consume minutos de GitHub Actions. Este workflow
# quedó redundante (y además duplicaría el análisis).
#
# Se conserva el archivo, con disparo manual, para no perder la configuración
# documentada en la Unidad 5. Para reactivar el escaneo por CI:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
# y desactivar antes el Automatic Analysis en SonarCloud
# (Administration > Analysis Method), porque no pueden convivir.
on:
  workflow_dispatch: {}

jobs:
  sonarcloud:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Tests con cobertura
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-only-test-secret-not-for-production
      - name: Escaneo SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
