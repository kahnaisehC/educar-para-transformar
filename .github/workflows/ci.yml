name: CI

# Pipeline de Integración Continua.
# Se dispara en cada push y en cada Pull Request dirigidos a main,
# de forma que ningún cambio llega a la rama principal sin pasar
# por build + typecheck + tests automatizados.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build, typecheck y test
    runs-on: ubuntu-latest

    # Variables de entorno necesarias para que la API levante durante
    # el job. Son valores de prueba, no sensibles: nunca se guardan
    # secretos reales en el workflow, solo en GitHub Secrets.
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret-not-for-production
      DATABASE_URL: postgres://educar:educar_dev_password@localhost:5432/educar
      CORS_ORIGIN: http://localhost:5173

    steps:
      # 1. Obtener el código (Source)
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm install

      # 4a. Linter (ESLint): primer quality gate de estilo y errores comunes
      - name: Lint
        run: npm run lint

      # 4b. Verificación de tipos (quality gate temprano)
      - name: Typecheck
        run: npm run typecheck

      # 5. Pruebas automatizadas (unitarias / integración con pg-mem)
      - name: Ejecutar tests
        run: npm test

      # 6. Build (genera los artefactos: dist/ de la API y del frontend)
      - name: Build
        run: npm run build

      # 7. Gestión de artefactos: se publican los resultados del build
      #    para que puedan reutilizarse en una etapa posterior (deploy)
      #    sin necesidad de reconstruir el software.
      - name: Publicar artefactos de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 7

  e2e:
    name: Pruebas E2E (Cypress)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: educar
          POSTGRES_USER: educar
          POSTGRES_PASSWORD: educar_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educar -d educar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://educar:educar_dev_password@localhost:5432/educar
      JWT_SECRET: ci-only-test-secret-not-for-production
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Inicializar base de datos (esquema, seed y migraciones)
        run: node scripts/init-db.mjs
      - name: Levantar API y frontend
        run: |
          npm run dev:api &
          npm run dev --workspace @educar/web -- --host &
          npx wait-on http://localhost:4000/api/health http://localhost:5173
      - name: Cypress
        run: npm run e2e
